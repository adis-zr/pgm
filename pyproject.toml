[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm-certified"
version = "0.2.0"
description = "Certified discrete inference with a common switchboard and packaged specialist methods"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "gmpy2>=2.3,<3", "psutil>=7,<8", "scipy>=1.17,<2"]

[project.scripts]
pgm = "pgm.__main__:main"

[tool.setuptools]
include-package-data = false

# All supported implementations and their native sources belong to pgm.
# Experiments, historical snapshots, benchmark tooling and generated binaries are not wheel contents.
[tool.setuptools.packages.find]
where = ["src"]
include = ["pgm", "pgm.*"]
exclude = ["*.native_cache*", "*.runs*"]

[tool.setuptools.package-data]
"pgm.algorithms.structural" = ["cex_kernel.cpp", "stream_kernel.cpp", "cex_build.json", "stream_build.json"]
"pgm.algorithms.quotient" = ["PHASE_RATES.json", "PHASE_RATES_R1.json"]
"pgm.algorithms.response" = ["heatbath_native.c"]
"pgm.algorithms.h4" = ["native/*.cpp", "native/*.hpp"]

[tool.setuptools.exclude-package-data]
"*" = ["*.so", "*.dylib", "native_cache/*", "heatbath_build.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
